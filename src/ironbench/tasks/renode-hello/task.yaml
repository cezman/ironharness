# The pilot task of the renode target (stage 2.6): MicroPython in Renode under WSL2.
# Firmware: LITEX_VEXRISCV-micropython-v1.11.0.elf in tasks/_firmware - an artifact
# from Renode (dl.antmicro.com/projects/renode/litex_vexriscv--micropython.elf-s_2713384-
# e2d6be24b6a0de3d1bcf3161e38191b0e4489010), litex_vexriscv_micropython.repl.
# The build has no machine/time/input - GPIO tasks stay on the wokwi target.
name: renode-hello
description: >-
  The program prints three lines to serial: "renode alive", then "no gpio here",
  then "bye now", and then exits. There is no input or timing - printing only.
entry: solution.py
target: renode
timeout_sec: 20
tags: [io]
level: 1
renode:
  platform: litex_vexriscv_micropython
  firmware: LITEX_VEXRISCV-micropython-v1.11.0.elf
expect:
  - 'renode alive'
  - 'no gpio here'
  - 'bye now'
fail:
  - 'Traceback'
