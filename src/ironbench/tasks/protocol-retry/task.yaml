# Task description for ironbench: see AGENTS.md / ironbench-task skill.
name: protocol-retry
description: >-
  The firmware implements a checksummed frame protocol over serial. Frame format:
  "<payload>*<checksum>", where checksum is a single character equal to the XOR byte
  of all payload characters (for example, for "hello" it is the character with code
  0x62, i.e. the frame "hello*b"). On startup prints "proto checksum". For every
  correct frame it answers "ACK <payload>", for a broken one (checksum mismatch, no
  '*' separator, or an empty line) - "NAK". Broken frames must not break the
  firmware: it keeps processing the following frames. Runs in an infinite loop.
entry: solution.py
timeout_sec: 20
tags: [protocol, resilience]
level: 3
expect:
  - 'proto checksum'
  - 'ACK hello'
  - 'NAK'
  - 'ACK world'
fail:
  - 'Traceback'
stimulus:
  # warm-up: the firmware must reach input(); Enter is \r only (wokwi-cli eats \n)
  - delay: 1500ms
  - write-serial: "hello*x\r"   # broken checksum -> NAK
  - delay: 400ms
  - write-serial: "hello*b\r"   # correct -> ACK hello
  - delay: 400ms
  - write-serial: "world*b\r"   # -> ACK world
