# Двухфазная ТАУ-задача: K и T объекта известны только этому yaml (не ТЗ!) —
# агент обязан сам оценить их по шагу отклика. render_log воркера сознательно
# не печатает K/T. Шум датчика заставляет оценивать по усреднённой траектории.
name: system-id
description: >-
  Объект — нагреватель: апериодическое звено первого порядка,
  y_oo = ambient + K*u. ambient = 20°C известен, а усиление K и постоянная
  времени T НЕИЗВЕСТНЫ — оцени их сам по переходной характеристике.
  Управление u в [0, 1] (мощность нагревателя), шум датчика ±0.3°C,
  уставка 60°C. main.py обязан определять функцию
  control(t, y, setpoint) -> float; её вызывают каждые 0.5 c симуляционного
  времени (t — секунды от старта, y — измеренная температура). План: фаза
  идентификации — держи u=1 достаточно долго (несколько T), оцени K по
  установившемуся превышению над ambient и T по времени достижения 63.2%
  превышения; затем фаза регулирования — выведи y на уставку, например
  компенсацией и П-обратной связью: u = (setpoint - ambient)/K_est +
  Kp*(setpoint - y). Требования: y вошла в полосу ±2°C от уставки и осталась
  там не позже 300 c, установившаяся ошибка не больше 2°C, перерегулирование
  не больше 20%.
entry: solution.py
target: plant
timeout_sec: 30
plant:
  model: heater
  K: 45.0
  T: 25.0
  ambient: 20.0
  setpoint: 60.0
  duration: 400
  dt: 0.5
  noise_std: 0.3
  seed: 11
  requirements:
    steady_error: 2.0
    settle_time: 300.0
    overshoot: 20.0
expect: []
fail:
  - 'Traceback'
