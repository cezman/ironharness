# Развитие класса «шумная линия»: линия не только портит/теряет кадры, но и
# склеивает обрывки (write-шаг op5 выброшен, хвост кадра 3 приклеился к кадру 4).
# Прошивка обязана досинхронизироваться по заголовку '#' и вытащить валидный хвост.
# xor2 = XOR байтов payload в hex (ab→03, cd→07, hi→01, qq→00); op2 портится
# бит-флипами (ratio 1.0) — контрольная сумма гарантированно не сойдётся.
name: frame-corrupt
description: >-
  Прошивка читает кадры из serial-консоли. Кадр — строка "#<id>:<payload>:<xor2>",
  где xor2 — контрольная сумма: XOR всех байтов payload в hex из двух знаков
  (например, для "#1:ab:03": XOR байтов 'a','b' равен 0x03). На каждый валидный
  кадр прошивка отвечает строкой "ack <id>", на битый или битый формат — "nak".
  Линия ненадёжна: байты портятся, записи теряются целиком, а обрывок кадра
  может приклеиться к началу следующего (в одной строке оказывается мусор и
  хвост другого кадра). Прошивка обязана досинхронизироваться по заголовку:
  в любой строке искать '#', разбирать сегменты до следующего '#' или конца
  строки, каждый валидный сегмент подтверждать "ack <id>", невалидный — "nak";
  строка вообще без '#' — это один "nak". Чего пришло меньше — не дело
  отправителя: он сам делает ретраи. Бесконечный цикл.
entry: solution.py
target: unix
timeout_sec: 20
tags: [resilience]
level: 4
noise:
  seed: 7
  faults:
    - action: corrupt
      after_ops: 1
      count: 1
      ratio: 1.0
    - action: drop
      after_ops: 4
      count: 1
expect:
  - 'ack 1'
  - 'nak'
  - 'ack 2'
  - 'nak'
  - 'ack 4'
  - 'ack 3'
fail:
  - 'Traceback'
stimulus:
  - delay: 100ms
  - write-serial: "#1:ab:03\r"    # чисто → ack 1
  - wait-serial: "ack 1"
  - write-serial: "#2:cd:07\r"    # портится линией → nak
  - wait-serial: "nak"
  - write-serial: "#2:cd:07\r"    # ретрай → ack 2
  - wait-serial: "ack 2"
  - write-serial: "#3:hi"         # начало кадра 3 без терминатора
  - write-serial: ":01\r"         # хвост кадра 3 линия выбрасывает
  - write-serial: "#4:qq:00\r"    # склейка: "3:hi" → nak, "#4:qq:00" → ack 4
  - wait-serial: "ack 4"
  - write-serial: "#3:hi:01\r"    # ретрай кадра 3 → ack 3
  - wait-serial: "ack 3"
