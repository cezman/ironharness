# An evolution of the "noisy line" class: the line not only corrupts/drops frames
# but also glues the pieces together (write step op5 is dropped, the tail of frame
# 3 got glued to frame 4). The firmware must resynchronize on the '#' header and
# extract the valid tail. xor2 = XOR of the payload bytes in hex (ab->03, cd->07,
# hi->01, qq->00); op2 is corrupted with bit flips (ratio 1.0) - the checksum is
# guaranteed to mismatch.
name: frame-corrupt
description: >-
  The firmware reads frames from the serial console. A frame is the line
  "#<id>:<payload>:<xor2>", where xor2 is a checksum: the XOR of all payload bytes
  as two hex digits (for example, for "#1:ab:03": the XOR of the bytes 'a','b'
  equals 0x03). For every valid frame the firmware answers with "ack <id>", for a
  corrupted frame or malformed line - "nak". The line is unreliable: bytes get
  corrupted, writes are dropped whole, and a frame fragment can get glued to the
  beginning of the next one (one line ends up containing junk and the tail of
  another frame). The firmware must resynchronize on the header: in any line,
  look for '#', parse the segments up to the next '#' or the end of the line,
  acknowledge each valid segment with "ack <id>", answer "nak" for an invalid
  one; a line with no '#' at all is one "nak". Missing frames are not the
  sender's problem: it retries on its own. Infinite loop.
entry: solution.py
target: unix
timeout_sec: 20
tags: [resilience]
level: 4
noise:
  seed: 7
  faults:
    - action: corrupt
      after_ops: 1
      count: 1
      ratio: 1.0
    - action: drop
      after_ops: 4
      count: 1
expect:
  - 'ack 1'
  - 'nak'      # the corrupted frame (op2) and the fragment in the glue-up both produce a nak
  - 'ack 2'
  - 'ack 4'
  - 'ack 3'
fail:
  - 'Traceback'
stimulus:
  - delay: 100ms
  - write-serial: "#1:ab:03\r"    # clean -> ack 1
  - wait-serial: "ack 1"
  - write-serial: "#2:cd:07\r"    # corrupted by the line -> nak
  - wait-serial: "nak"
  - write-serial: "#2:cd:07\r"    # retry -> ack 2
  - wait-serial: "ack 2"
  - write-serial: "#3:hi"         # beginning of frame 3 without a terminator
  - write-serial: ":01\r"         # the line drops the tail of frame 3
  - write-serial: "#4:qq:00\r"    # glue-up: "3:hi" -> nak, "#4:qq:00" -> ack 4
  - wait-serial: "ack 4"
  - write-serial: "#3:hi:01\r"    # retry of frame 3 -> ack 3
  - wait-serial: "ack 3"
