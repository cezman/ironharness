# Первая задача класса «управление» (ТАУ) на plant-мишени: объект — нагреватель
# 1-го порядка, от агента требуется осознанный выбор коэффициента П-регулятора
# (установившаяся ошибка П-петли e_ss = (r-ambient)/(1+K·Kp) — в ТЗ данных
# достаточно, чтобы Kp пришлось посчитать). Оценка — метрики, не regex.
name: p-regulator
description: >-
  Объект — нагреватель: апериодическое звено первого порядка. Установившаяся
  температура y_oo = ambient + K*u, где ambient = 20°C, K = 60 (°C при u=1),
  постоянная времени T = 30 c. Напиши П-регулятор: main.py обязан определять
  функцию control(t, y, setpoint) -> float. Её вызывают каждые 0.5 c
  симуляционного времени: t — секунды от старта, y — измеренная температура,
  setpoint — уставка 74°C. Возврат зажимается в [0, 1] (мощность нагревателя).
  Регулятор имеет вид u = Kp*(setpoint - y). Подбери Kp так, чтобы: y вошла
  в полосу ±2°C от уставки и осталась там не позже 100 c (время установления),
  установившаяся ошибка была не больше 2°C, перерегулирование — не больше 15%.
entry: solution.py
target: plant
timeout_sec: 30
plant:
  model: heater
  K: 60.0
  T: 30.0
  ambient: 20.0
  setpoint: 74.0
  duration: 180
  dt: 0.5
  u_min: 0.0
  u_max: 1.0
  requirements:
    steady_error: 2.0
    settle_time: 100.0
    overshoot: 15.0
expect: []
fail:
  - 'Traceback'
