# Описание задачи для ironbench: см. AGENTS.md / skills ironbench-task.
name: traffic-light
description: >-
  Конечный автомат светофора: red 3 секунды → green 3 секунды → yellow 1 секунда → снова red,
  циклически. Каждый вход в состояние печатается строкой "state: <имя>". Порядок переходов
  и цикличность обязательны.
entry: solution.py
timeout_sec: 20
expect:
  # 'cycle: 2' — литеральный маркер: wait-serial держит симуляцию до конца второго цикла
  - 'cycle: 2'
  # порядок переходов red→green→yellow→red проверяем одним regex'ом
  - 'state: red[\s\S]*state: green[\s\S]*state: yellow[\s\S]*state: red'
fail:
  - 'Traceback'
