# Task description for ironbench: see AGENTS.md / ironbench-task skill.
name: traffic-light
description: >-
  A traffic-light state machine: red 3 seconds -> green 3 seconds -> yellow 1 second -> red again,
  cyclically. Every state entry is printed as "state: <name>". The transition order
  and the cyclic behavior are mandatory.
entry: solution.py
timeout_sec: 20
tags: [fsm]
level: 3
expect:
  # 'cycle: 2' - a literal marker: wait-serial holds the simulation until the end of the second cycle
  - 'cycle: 2'
  # the transition order red->green->yellow->red is checked with a single regex
  - 'state: red[\s\S]*state: green[\s\S]*state: yellow[\s\S]*state: red'
fail:
  - 'Traceback'
