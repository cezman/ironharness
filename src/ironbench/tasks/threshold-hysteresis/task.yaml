# Класс «данные»: тревога по порогу с гистерезисом 30/28. Порядок состояний
# off→on→on→off проверяется одним regex'ом: повторное 'alarm: on' на
# внутриполосном зонде (29) и есть проверка гистерезиса. ЖИВАЯ ВЕРИФИКАЦИЯ
# ОТЛОЖЕНА (квота Wokwi, 2026-09-07): тайминги чтений сверить при живом прогоне.
name: threshold-hysteresis
description: >-
  Датчик DHT22 подключен к GPIO4 (питание 3V3, земля GND). Прошивка в цикле раз
  в 2.5 секунды опрашивает датчик и управляет тревогой с гистерезисом: тревога
  включается, когда температура поднимается до 30°C и выше; выключается, только
  когда она опускается до 28°C и ниже. Внутри полосы 28..30°C состояние
  не меняется. На каждом измерении печатается текущее состояние строкой
  "alarm: on" или "alarm: off" (каждое чтение — ровно одна строка). Одиночный
  сбой чтения (OSError) не фатален. Бесконечный цикл.
entry: solution.py
timeout_sec: 30
tags: [data]
level: 3
expect:
  # последовательность чтений 25 → 31 → 29 → 27: off → on → on (гистерезис!) → off
  - 'alarm: off[\s\S]*alarm: on[\s\S]*alarm: on[\s\S]*alarm: off'
fail:
  - 'Traceback'
stimulus:
  # первый delay — прогрев; затем по ~одному чтению на каждую температуру
  - delay: 1500ms
  - set-control: {part-id: dht1, control: temperature, value: 25}
  - delay: 1500ms
  - set-control: {part-id: dht1, control: temperature, value: 31}
  - delay: 2600ms
  - set-control: {part-id: dht1, control: temperature, value: 29}
  - delay: 2600ms
  - set-control: {part-id: dht1, control: temperature, value: 27}
