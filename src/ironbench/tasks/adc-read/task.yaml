# Data class: ADC + linear scale. LIVE VERIFICATION POSTPONED (Wokwi quota,
# 2026-09-07): at a live run check that the potentiometer set-control is called
# 'position' and the literal 'mv: 0' is unique in the log (it is the last wait-serial).
name: adc-read
description: >-
  A potentiometer is connected to GPIO34 (an ADC1 input). The firmware configures
  the full input range (11 dB attenuation, ~3.3 V) and in an infinite loop reads
  the ADC every 0.3 seconds, printing the voltage in millivolts as "mv: <integer>".
  The scale is linear over the reference points: raw 0 -> 0 mV, raw 4095 ->
  3300 mV (conversion raw * 3300 // 4095).
entry: solution.py
timeout_sec: 30
tags: [data]
level: 2
expect:
  - 'mv: (329[5-9]|3300)'
  - 'mv: 16(4[0-9]|5[0-9])'
  - 'mv: 0'
fail:
  - 'Traceback'
stimulus:
  # the first delay is a warm-up: the firmware must reach the polling loop
  - delay: 1500ms
  - set-control: {part-id: pot1, control: position, value: 100}
  - delay: 900ms
  - set-control: {part-id: pot1, control: position, value: 50}
  - delay: 900ms
  - set-control: {part-id: pot1, control: position, value: 0}
  - wait-serial: "mv: 0"
