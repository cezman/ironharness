# Resilience to pathological input: an incurable line (longer than 32 characters)
# is treated as a reason for a "watchdog reset" - state to zero, a report, and
# continued operation. Discriminator: after the reset get must return val 0.
name: watchdog
description: >-
  On startup the firmware prints "wd ready" and in an infinite loop serves
  commands line by line: "ping" -> answers "pong"; "set <integer>" -> stores the
  integer and answers "ok <integer>"; "get" -> answers "val <stored integer>"
  (0 before the first set). Pathological input - a line longer than 32 characters:
  the firmware must treat it as an unrecoverable input error: reset the state to
  the initial one (forget the stored integer), print "wd: reset" and keep serving
  commands as if nothing happened (crashing is not allowed).
entry: solution.py
target: unix
timeout_sec: 15
tags: [resilience]
level: 3
expect:
  - 'wd ready'
  - 'pong'
  - 'ok 5'
  - 'val 5'
  - 'wd: reset'
  - 'val 0'
  - 'ok 7'
  - 'val 7'
fail:
  - 'Traceback'
stimulus:
  - delay: 100ms
  - write-serial: "ping\r"
  - wait-serial: "pong"
  - write-serial: "set 5\r"
  - wait-serial: "ok 5"
  - write-serial: "get\r"
  - wait-serial: "val 5"
  # pathological input (40 characters) -> a state reset
  - write-serial: "ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ\r"
  - wait-serial: "wd: reset"
  - write-serial: "get\r"
  - wait-serial: "val 0"
  - write-serial: "set 7\r"
  - wait-serial: "ok 7"
  - write-serial: "get\r"
  - wait-serial: "val 7"
