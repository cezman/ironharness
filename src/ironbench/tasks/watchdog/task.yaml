# Устойчивость к патологическому вводу: неисправимая строка (длиннее 32 символов)
# трактуется как повод для «сторожевого сброса» — состояние в ноль, отчёт и
# продолжение работы. Дискриминатор: после сброса get обязан вернуть val 0.
name: watchdog
description: >-
  Прошивка при старте печатает "wd ready" и в бесконечном цикле обслуживает
  команды построчно: "ping" → ответ "pong"; "set <целое>" → запоминает целое и
  отвечает "ok <целое>"; "get" → отвечает "val <запомненное целое>" (до первого
  set — 0). Патологический ввод — строка длиннее 32 символов: прошивка обязана
  трактовать его как неисправимую ошибку ввода: сбросить состояние в начальное
  (забыть запомненное целое), напечатать "wd: reset" и продолжать обслуживать
  команды как ни в чём не бывало (падать нельзя).
entry: solution.py
target: unix
timeout_sec: 15
tags: [resilience]
level: 3
expect:
  - 'wd ready'
  - 'pong'
  - 'ok 5'
  - 'val 5'
  - 'wd: reset'
  - 'val 0'
  - 'ok 7'
  - 'val 7'
fail:
  - 'Traceback'
stimulus:
  - delay: 100ms
  - write-serial: "ping\r"
  - wait-serial: "pong"
  - write-serial: "set 5\r"
  - wait-serial: "ok 5"
  - write-serial: "get\r"
  - wait-serial: "val 5"
  # патологический ввод (40 символов) → сброс состояния
  - write-serial: "ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ\r"
  - wait-serial: "wd: reset"
  - write-serial: "get\r"
  - wait-serial: "val 0"
  - write-serial: "set 7\r"
  - wait-serial: "ok 7"
  - write-serial: "get\r"
  - wait-serial: "val 7"
