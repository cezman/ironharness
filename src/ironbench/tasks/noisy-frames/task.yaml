# The golden task of the "noisy line" class (backlog plan: frame-corrupt):
# the line corrupts and drops frames; the firmware must verify the checksum
# and honestly answer ack/nak; retransmission is the sender's job (the stimulus).
# The noise is deterministic (seed) and described by the noise section; one op of
# the counter = one write-serial step: op1 gets corrupted, op3 is dropped.
name: noisy-frames
description: >-
  The firmware reads frames from the serial console. A frame is the line
  "<id>:<payload>:<xor2>", where xor2 is a checksum: the XOR of all payload bytes
  as two hex digits (for example, for "1:hello:62": the XOR of the bytes
  'h','e','l','l','o' equals 0x62). For every frame the firmware answers with
  exactly one line: "ack <id>" if the format is correct and the checksum
  matches, otherwise "nak". The line is noisy: some frames arrive corrupted or
  are lost entirely; retransmission is the sender's job, the firmware just
  answers honestly. Infinite loop.
entry: solution.py
target: unix
timeout_sec: 20
tags: [resilience, protocol]
level: 3
noise:
  seed: 7
  faults:
    - action: corrupt
      after_ops: 0
      count: 1
      ratio: 1.0
    - action: drop
      after_ops: 2
      count: 1
expect:
  - 'nak'
  - 'ack 1'
  - 'ack 2'
  - 'ack 3'
fail:
  - 'Traceback'
stimulus:
  # the first delay is a warm-up: the firmware must reach input()
  - delay: 100ms
  - write-serial: "1:hello:62\r"   # the frame gets corrupted by the line -> nak
  - wait-serial: "nak"
  - write-serial: "1:hello:62\r"   # retry - clean -> ack 1
  - wait-serial: "ack 1"
  - write-serial: "2:abc:60\r"     # the line drops the frame body, the bare \n arrives -> nak
  - write-serial: "2:abc:60\r"     # retry - clean -> ack 2
  - wait-serial: "ack 2"
  - write-serial: "3:x:78\r"       # clean -> ack 3
  - wait-serial: "ack 3"
