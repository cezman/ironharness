# An FSM with a nested state: two submodes with their own input (a name / numbers
# until an empty line) + handling of an invalid command. A difficulty step above
# the first-level protocol/FSM tasks. The unix-port echo writes the input into the
# log - the expects are chosen without collisions.
name: uart-menu
description: >-
  The firmware is a text menu over UART. After startup it prints the line
  "MENU 1=greet 2=sum 3=quit" and reads commands line by line. Command "1": prints
  "NAME?", reads one name line, prints "HELLO <name>" and returns to the menu.
  Command "2": prints "NUMS?", reads number lines until an empty line arrives,
  prints "SUM=<sum>" and returns to the menu. Command "3": prints
  "BYE" and exits (the program is finite). Any other non-empty line instead of a
  command: prints "ERR" and returns to the menu. The exact label texts are
  mandatory (as in the quotes, without extra spaces). Infinite loop until "3".
entry: solution.py
target: unix
timeout_sec: 20
tags: [fsm]
level: 3
expect:
  - 'MENU'
  - 'ERR'
  - 'NAME?'
  - 'HELLO bob'
  - 'NUMS?'
  - 'SUM=6'
  - 'BYE'
fail:
  - 'Traceback'
stimulus:
  - delay: 100ms
  - write-serial: "9\r"           # invalid command -> ERR
  - wait-serial: "ERR"
  - write-serial: "1\r"           # the greeting submode
  - wait-serial: "NAME?"
  - write-serial: "bob\r"
  - wait-serial: "HELLO bob"
  - write-serial: "2\r"           # the sum submode
  - wait-serial: "NUMS?"
  - write-serial: "2\r"
  - write-serial: "3\r"
  - write-serial: "1\r"
  - write-serial: "\r"            # an empty line - end of the list
  - wait-serial: "SUM=6"
  - write-serial: "3\r"           # exit
  - wait-serial: "BYE"
