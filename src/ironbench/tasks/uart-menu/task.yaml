# FSM с вложенным состоянием: два подрежима со своим вводом (имя / числа до
# пустой строки) + обработка неверной команды. Градация сложности выше protocol/FSM
# первого уровня. Эхо unix-порта пишет ввод в лог — expect подобраны без коллизий.
name: uart-menu
description: >-
  Прошивка — текстовое меню на UART. После старта печатает строку
  "MENU 1=greet 2=sum 3=quit" и читает команды построчно. Команда "1": печатает
  "NAME?", читает одну строку-имя, печатает "HELLO <имя>" и возвращается к меню.
  Команда "2": печатает "NUMS?", читает строки-числа, пока не придёт пустая
  строка, печатает "SUM=<сумма>" и возвращается к меню. Команда "3": печатает
  "BYE" и завершает работу (программа конечная). Любая другая непустая строка
  вместо команды: печатает "ERR" и возвращается к меню. Точные тексты меток
  обязательны (как в кавычках, без лишних пробелов). Бесконечный цикл до "3".
entry: solution.py
target: unix
timeout_sec: 20
tags: [fsm]
level: 3
expect:
  - 'MENU'
  - 'ERR'
  - 'NAME?'
  - 'HELLO bob'
  - 'NUMS?'
  - 'SUM=6'
  - 'BYE'
fail:
  - 'Traceback'
stimulus:
  - delay: 100ms
  - write-serial: "9\r"           # неверная команда → ERR
  - wait-serial: "ERR"
  - write-serial: "1\r"           # подрежим приветствия
  - wait-serial: "NAME?"
  - write-serial: "bob\r"
  - wait-serial: "HELLO bob"
  - write-serial: "2\r"           # подрежим суммы
  - wait-serial: "NUMS?"
  - write-serial: "2\r"
  - write-serial: "3\r"
  - write-serial: "1\r"
  - write-serial: "\r"            # пустая строка — конец списка
  - wait-serial: "SUM=6"
  - write-serial: "3\r"           # выход
  - wait-serial: "BYE"
