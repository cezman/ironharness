# ТАУ-задача на интегральное насыщение: разгон долгое время идёт в насыщении
# u=1, поэтому «наивный» интегратор (без anti-windup) успевает набрать огромный
# запас и просаживает y далеко за уставку — ловится метрикой overshoot.
# Эталон — ПИ с conditional integration (интегрируем, только пока не в насыщении
# или пока ошибка выводит из насыщения).
name: pid-antiwindup
description: >-
  Объект — нагреватель: апериодическое звено первого порядка. Установившаяся
  температура y_oo = ambient + K*u, где ambient = 20°C, K = 60 (°C при u=1),
  постоянная времени T = 30 c. Напиши ПИ-регулятор с защитой от интегрального
  насыщения (anti-windup): main.py обязан определять функцию
  control(t, y, setpoint) -> float. Её вызывают каждые 0.5 c симуляционного
  времени: t — секунды от старта, y — измеренная температура, setpoint —
  уставка 74°C. Возврат зажимается в [0, 1] (мощность нагревателя); интегральную
  составляющую копи на каждом вызове как integ += Ki*(setpoint - y)*0.5.
  Требования: y вошла в полосу ±1°C от уставки и осталась там не позже 140 c,
  установившаяся ошибка не больше 1°C, перерегулирование не больше 5%
  (поэтому интегратор обязан не «раскачиваться», пока актюатор в насыщении).
entry: solution.py
target: plant
timeout_sec: 30
plant:
  model: heater
  K: 60.0
  T: 30.0
  ambient: 20.0
  setpoint: 74.0
  duration: 240
  dt: 0.5
  u_min: 0.0
  u_max: 1.0
  requirements:
    steady_error: 1.0
    settle_time: 140.0
    overshoot: 5.0
expect: []
fail:
  - 'Traceback'
