# wokwi.toml — дескриптор проекта для wokwi-cli (симуляция в облаке Wokwi).
# MicroPython в CLI-режиме требует явную прошивку: elf/firmware указывают на .bin
# (закреплён v1.27.0 из wokwi/wokwi-vscode-micropython — воспроизводимость прогонов).
[wokwi]
version = 1
elf = "ESP32_GENERIC-20251209-v1.27.0.bin"
firmware = "ESP32_GENERIC-20251209-v1.27.0.bin"
