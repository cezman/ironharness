# Task description for ironbench: see AGENTS.md / ironbench-task skill.
name: debounce
description: >-
  A button is connected to GPIO4 and pulls it to ground (use the internal pullup).
  The firmware counts clean button presses with debouncing (ignore spurious
  switches shorter than ~30 ms) and prints "presses: N" on every press,
  where N starts at 1.
entry: solution.py
timeout_sec: 20
tags: [io]
level: 2
expect:
  - 'presses: 1'
fail:
  - 'presses: [2-9]'
  - 'presses: \d{2,}'
  - 'presses: 0'
  - 'Traceback'
stimulus:
  # the first delay is a warm-up: the button polling loop must have time to start
  - delay: 1500ms
  - set-control: {part-id: btn1, control: pressed, value: 1}
  - delay: 20ms
  - set-control: {part-id: btn1, control: pressed, value: 0}
  - delay: 20ms
  - set-control: {part-id: btn1, control: pressed, value: 1}
  - delay: 100ms
  - set-control: {part-id: btn1, control: pressed, value: 0}
  - delay: 200ms
