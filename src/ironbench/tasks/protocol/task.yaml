# Task description for ironbench: see AGENTS.md / ironbench-task skill.
name: protocol
description: >-
  A text command protocol over serial, an LED on GPIO2. On startup prints "proto v1".
  Commands: "led on" and "led off" -> answer "OK" (and turn the LED on/off); "state?" ->
  "state: on" or "state: off" per the current state; any other non-empty line ->
  "ERR unknown". Runs in an infinite loop.
entry: solution.py
timeout_sec: 20
tags: [protocol]
level: 2
expect:
  - 'proto v1'
  - 'state: off'
  - 'state: on'
  - 'ERR unknown'
fail:
  - 'Traceback'
stimulus:
  # the first delay is a warm-up; in write-serial Enter is \r only (wokwi-cli swallows \n)
  - delay: 1500ms
  - write-serial: "state?\r"
  - delay: 400ms
  - write-serial: "led on\r"
  - delay: 400ms
  - write-serial: "state?\r"
  - delay: 400ms
  - write-serial: "bogus\r"
