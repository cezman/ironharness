# Кооперативная многозадачность: два периода (A 0.5 c, B 1.2 c) без sleep в лоб,
# выбор ближайшего дедлайна; конечный горизонт 6 c и итоговая строка. Допуски в
# expect щедрые (±2 срабатывания) — WSL-тайминги неидеальны. Живой прогон
# сверяет фактические числа с допусками.
name: coop-scheduler
description: >-
  Прошивка — кооперативный планировщик двух периодических задач: задача A с
  периодом 0.5 секунды печатает "A", задача B с периодом 1.2 секунды печатает
  "B". Планирование по дедлайнам: в каждый момент исполняется та задача, чей
  срок наступил раньше (блокирующий sleep на полный период ломает расписание —
  так нельзя). Через 6 секунд от старта прошивка печатает итог строкой
  "A=<count> B=<count> ok" и завершается; count — сколько раз успела сработать
  каждая задача (ожидаемо A около 11, B около 4 при горизонте 6 c).
entry: solution.py
target: unix
timeout_sec: 15
tags: [control]
level: 3
expect:
  - 'A=(9|1[0-3]) B=[3-6] ok'
fail:
  - 'Traceback'
