# Task description for ironbench: see AGENTS.md / ironbench-task skill.
name: uart-echo
description: >-
  On startup the firmware prints "echo ready", then in an infinite loop reads lines
  from the serial console and answers each one with "echo: <line>" (the program
  never exits).
entry: solution.py
timeout_sec: 20
tags: [io]
level: 1
expect:
  - 'echo ready'
  - 'echo: hello'
  - 'echo: world'
fail:
  - 'Traceback'
stimulus:
  # the first delay is a warm-up: the firmware must reach input(), otherwise the
  # input is lost. In write-serial Enter is \r only: wokwi-cli swallows \n.
  - delay: 1500ms
  - write-serial: "hello\r"
  - delay: 400ms
  - write-serial: "world\r"
# Expert notes from the live bench (2026-09-20, IH-21 A/B difficulty knob):
# fed to the solve agent's prompt; the fact is recorded in results.jsonl
# (benchmark honesty, IH-21).
notes:
  - 'The serial console IS the USB REPL: read with input() and answer with print() - machine.UART is an unrelated, unwired bus on this board.'
  - 'input() returns the received line without its trailing newline; answer each line immediately with exactly "echo: <line>".'
  - 'Print "echo ready" once at startup, then loop forever - the program must never exit.'
