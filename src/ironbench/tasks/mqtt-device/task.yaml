# A network task: the firmware itself speaks MQTT with a broker (mqtt_sim nearby
# in WSL2). The harness is the second party of the exchange: it collects the
# publications into the serial log (lines "mqtt: <topic> <payload>", expect works
# on those too) and sends a retained command. The highest level: the agent writes
# its own mini-MQTT client from scratch over TCP.
name: mqtt-device
description: >-
  The firmware is an MQTT device. The broker address is given by the environment
  variables IRONBENCH_MQTT_HOST (127.0.0.1) and IRONBENCH_MQTT_PORT. Implement a
  mini MQTT 3.1.1 client over TCP (no libraries: CONNECT/CONNACK,
  SUBSCRIBE/SUBACK, PUBLISH QoS0, parsing incoming PUBLISH). Connect with client
  id "dev1", a subscription to the topic "dev1/cmd" (QoS 0), and after
  CONNACK+SUBACK print "mqtt ready". Then loop for 12 iterations with a ~0.5 s
  pause: publish the counter string to the topic "dev1/value" (the first
  publication "1", each next one greater by 1), adding the current offset. An
  incoming message in "dev1/cmd" of the form "add <integer>" (QoS 0) increases
  the offset by <integer>; print "applied" each time it is applied. After the
  12th publication print "mqtt done <offset>" and exit. All communication with
  the broker goes over MQTT; print only the specified lines to serial.
entry: solution.py
target: unix
timeout_sec: 25
tags: [protocol]
level: 5
mqtt:
  client_id: ironbench-mqtt-device
expect:
  - 'mqtt ready'
  - 'mqtt: dev1/value 1\n'
  - 'applied'
  - 'mqtt: dev1/value 4[0-9]'
  - 'mqtt done 40'
fail:
  - 'Traceback'
stimulus:
  # the harness collects the first publications (offset=0), then sends the retained command
  - mqtt-collect: {topic: dev1/value, count: 3, timeout_sec: 15}
  - mqtt-publish: {topic: dev1/cmd, payload: "add 40", retain: true}
  - mqtt-collect: {topic: dev1/value, count: 3, timeout_sec: 15}
  - wait-serial: "mqtt done"
