# Data class: a median filter of window 5 against single sensor spikes. The
# firmware prints the median only over the full window - otherwise during the
# warm-up the median of the pair (25, 40) would produce a false spike. LIVE
# VERIFICATION POSTPONED (Wokwi quota, 2026-09-07): cross-check the spike timing
# at a live run.
name: median-filter
description: >-
  A DHT22 sensor is connected to GPIO4 (power 3V3, ground GND). On startup the
  firmware prints "dht ready", then polls the sensor every 2.5 seconds in a loop
  and keeps a window of the last 5 temperature readings. As soon as the window is
  full, after each new reading the window median is printed as "med: <number>"
  (do not print before the window is full). A single read failure (OSError) is
  not fatal. The median must suppress single sensor spikes.
entry: solution.py
timeout_sec: 30
tags: [data]
level: 3
expect:
  - 'dht ready'
  - 'med: 25'
fail:
  - 'med: (3[0-9]|4[0-9])'
  - 'Traceback'
stimulus:
  # the first delay is a warm-up: the firmware must reach the polling loop
  - delay: 1500ms
  - set-control: {part-id: dht1, control: temperature, value: 25}
  # baseline 25: the window of 5 fills by ~12.5 s, the median prints
  - delay: 12000ms
  # a single spike: it lives shorter than two polling cycles - the median must not flinch
  - set-control: {part-id: dht1, control: temperature, value: 40}
  - delay: 2600ms
  - set-control: {part-id: dht1, control: temperature, value: 25}
