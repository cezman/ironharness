# Класс «данные»: медианный фильтр окна 5 против одиночных выбросов датчика.
# Прошивка печатает медиану только по заполненному окну — иначе на прогреве
# медиана пары (25, 40) дала бы ложный выброс. ЖИВАЯ ВЕРИФИКАЦИЯ ОТЛОЖЕНА
# (квота Wokwi, 2026-09-07): тайминги выброса сверить при живом прогоне.
name: median-filter
description: >-
  Датчик DHT22 подключен к GPIO4 (питание 3V3, земля GND). Прошивка при старте
  печатает "dht ready", затем в цикле раз в 2.5 секунды опрашивает датчик и
  держит окно последних 5 измерений температуры. Как только окно заполнено,
  после каждого нового измерения печатается медиана окна строкой "med: <число>"
  (печать до заполнения окна — не делать). Одиночный сбой чтения (OSError) не
  фатален. Медиана обязана гасить одиночные выбросы датчика.
entry: solution.py
timeout_sec: 30
tags: [data]
level: 3
expect:
  - 'dht ready'
  - 'med: 25'
fail:
  - 'med: (3[0-9]|4[0-9])'
  - 'Traceback'
stimulus:
  # первый delay — прогрев: прошивка должна дойти до цикла опроса
  - delay: 1500ms
  - set-control: {part-id: dht1, control: temperature, value: 25}
  # базовая линия 25: окно 5 заполняется к ~12.5 c, медиана печатается
  - delay: 12000ms
  # одиночный выброс: живёт меньше двух циклов опроса — медиана не должна дрогнуть
  - set-control: {part-id: dht1, control: temperature, value: 40}
  - delay: 2600ms
  - set-control: {part-id: dht1, control: temperature, value: 25}
