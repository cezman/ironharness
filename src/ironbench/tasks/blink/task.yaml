# Описание задачи для ironbench. expect — regex-паттерны: все обязаны встретиться
# в serial-выводе; fail — паттерны, появление которых сразу проваливает задачу.
# entry — эталонное решение, которое раннер вставляет в REPL (main.py остаётся
# файлом агента в бенчмарке и в задаче не хранится).
# ВАЖНО: description — полное ТЗ для агента: все форматы строк и тайминги задаются
# здесь, expect в task.yaml агенту не виден.
name: blink
description: >-
  ESP32 мигает светодиодом на GPIO2: 0.5 секунды горит, 0.5 секунды не горит, бесконечно.
  При каждом включении печатает в serial "blink <N>: on", при каждом выключении —
  "blink <N>: off", где N — номер хода, начиная с 0 (то есть "blink 0: on",
  "blink 0: off", "blink 1: on", "blink 1: off", ...).
entry: solution.py
timeout_sec: 20
tags: [io]
level: 1
expect:
  - 'blink 0: on'
  - 'blink 0: off'
  - 'blink 2: off'
fail:
  - 'Traceback'
