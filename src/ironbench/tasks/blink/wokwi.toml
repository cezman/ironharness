# wokwi.toml - the project descriptor for wokwi-cli (a simulation in the Wokwi cloud).
# MicroPython in CLI mode requires an explicit firmware: elf/firmware point to a .bin
# (v1.27.0 from wokwi/wokwi-vscode-micropython is pinned - run reproducibility).
[wokwi]
version = 1
elf = "ESP32_GENERIC-20251209-v1.27.0.bin"
firmware = "ESP32_GENERIC-20251209-v1.27.0.bin"
