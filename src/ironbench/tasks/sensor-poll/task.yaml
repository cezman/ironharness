# Task description for ironbench: see AGENTS.md / ironbench-task skill.
name: sensor-poll
description: >-
  A DHT22 sensor is connected to GPIO4 (power 3V3, ground GND). On startup the firmware
  prints "dht ready", then polls the sensor every 2 seconds and prints the temperature
  as "temp: <number>". Do not treat a single read failure (OSError) as fatal - keep polling.
entry: solution.py
timeout_sec: 30
tags: [data]
level: 2
expect:
  - 'dht ready'
  - 'temp: \d+'
  - 'temp: 31'
fail:
  - 'Traceback'
stimulus:
  - delay: 300ms
  - set-control: {part-id: dht1, control: temperature, value: 31}
  - delay: 2500ms
