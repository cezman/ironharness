name: ops-flash-verify
level: 3
tags: [io, resilience]
wall_sec: 1200
allowed_tools: [serial, esp]
budget: {max_iterations: 8, iter_timeout_sec: 300}
description: |
  The board on serial port $PORT is fully blank (flash erased). Perform a
  firmware recovery: flash the MicroPython firmware image (url and sha256
  below) and verify the board boots into a working interactive REPL.
  Finish with CLAIM: SUCCESS only after you have evidence the REPL is alive
  (the board answers commands), or CLAIM: FAIL if you could not.
assets:
  firmware:
    url: https://micropython.org/resources/firmware/ESP32_GENERIC-20251209-v1.27.0.bin
    sha256: aa4be80ec695911ba0f13f7558e559ce540f90efbf40c23b853ca49162136b9f
  meteo_main: {path: ../ops-wipe-deploy/meteo_main.py}
dossier:
  - "Board: ESP32 devkit behind a CH340 USB-UART bridge at $PORT, 115200 baud."
  - "The target firmware is MicroPython v1.27.0 (ESP32_GENERIC build)."
  - "pyserial asserts DTR/RTS on port open; on this board that can hold the chip in reset - drive both lines low after opening."
  - "The MicroPython REPL terminates lines on \\r only; a healthy REPL echoes executed commands and prints results."
  - "Firmware image for esptool: write at offset 0x1000. A local cached copy is at: $ASSET_firmware"
setup:
  - wipe_flash: {}
judge:
  - boot_expect: {literals: ["MicroPython v1.27.0"], repl_echo: true, within_sec: 40}
restore:
  - flash_asset: {asset: firmware}
  - deploy_file: {asset: meteo_main, target: /main.py}
