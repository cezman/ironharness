[project]
name = "ironharness"
version = "0.7.0"
description = "io-core — a safe I/O layer for LLM agents (MCP server); ironbench — a benchmark for firmware agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tsyren Balmaev (cezman)" }]
keywords = ["mcp", "agents", "hardware", "serial", "modbus", "mqtt", "esp32", "firmware", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    # IH-41: the floors must be TESTED, not just tolerated - mcp 1.2.0 and
    # pymodbus 3.7.0 legally satisfied the old metadata and broke core paths
    # (mcp 1.2.0 has no MCPServer; pymodbus 3.7.0 has no device_id kwarg).
    # The floors below are the lock-verified minimums the CI min-deps job
    # installs exactly (scripts/min_deps.py parses them from here).
    "mcp>=2.1.1",
    "paho-mqtt>=2.0",
    "pymodbus>=3.15.0",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
flash = ["esptool>=5"]  # GPLv2+ dependency kept out of the MIT core

[project.urls]
Repository = "https://github.com/cezman/ironharness"
Issues = "https://github.com/cezman/ironharness/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.16.6",  # pinned (IH-50 lesson): CI resolves >=0.6 to the latest and lints with rules the local lock does not have - one version everywhere
]

[project.scripts]
ironbench = "ironbench.cli:main"
ironharness-mcp = "io_core.mcp_server:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/io_core", "src/ironbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
