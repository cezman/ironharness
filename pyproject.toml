[project]
name = "ironharness"
version = "0.4.0"
description = "io-core — a safe I/O layer for LLM agents (MCP server); ironbench — a benchmark for firmware agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tsyren Balmaev (cezman)" }]
keywords = ["mcp", "agents", "hardware", "serial", "modbus", "mqtt", "esp32", "firmware", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "mcp>=1.2.0",
    "paho-mqtt>=2.0",
    "pymodbus>=3.7",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
flash = ["esptool>=5"]  # GPLv2+ dependency kept out of the MIT core

[project.urls]
Repository = "https://github.com/cezman/ironharness"
Issues = "https://github.com/cezman/ironharness/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ironbench = "ironbench.cli:main"
ironharness-mcp = "io_core.mcp_server:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/io_core", "src/ironbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
