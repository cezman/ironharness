name: uart-echo-paste
version: 1
author: ironbench
steps:
- wait-serial: '>>>'
- write-serial: "\x05"
- delay: 200ms
- write-serial: "# UART echo: reads lines from serial and prints \"echo: <line>\"\
    \ for each.\n# The banner is glued from two strings so the echo of the pasted\
    \ source does not match expect.\nprint(\"echo \" + \"ready\")\nwhile True:\n \
    \   line = input()\n    print(\"echo: \" + line.strip())\n"
- write-serial: "\x04"
- delay: 1500ms
- write-serial: "hello\r"
- delay: 400ms
- write-serial: "world\r"
- wait-serial: echo ready
- wait-serial: 'echo: hello'
- wait-serial: 'echo: world'
